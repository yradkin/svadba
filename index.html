<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Свадьба: план и бюджет</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&display=swap">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: мобильное мини-приложение — шапка, экран, плавающий таб-бар; карточки подрядчиков открываются полноэкранным стеклянным листом. Стиль: liquid glass на перламутровой «ауре» — полупрозрачные слои с размытием, блик сверху, радужная кромка; золото — для отметок «в договоре». */
:root{
  --bg:#f5eff5; --tint:rgba(248,243,249,.86); --surface:rgba(255,255,255,.42); --surface-2:rgba(255,255,255,.44); --field:rgba(255,255,255,.62);
  --line:rgba(70,36,86,.10); --line-2:rgba(70,36,86,.20); --glass-brd:rgba(255,255,255,.78); --spec:rgba(255,255,255,.95);
  --sheen:linear-gradient(140deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 34%,rgba(255,255,255,0) 60%);
  --iris:conic-gradient(from 210deg,#ffd3ea,#dccfff,#c4ebff,#cdfbe8,#fff0c6,#ffd3ea);
  --pearl:linear-gradient(118deg,#fde3f0 0%,#e7ddfc 26%,#d6f2ee 52%,#fbe9d8 76%,#fde3f0 100%);
  --ink-grad:linear-gradient(118deg,#2a1631 0%,#58275f 52%,#33386f 100%);
  --num-grad:linear-gradient(100deg,#7a2c63 0%,#5b49b4 55%,#22808a 100%);
  --txt:#1c1426; --txt-2:rgba(28,20,38,.70); --txt-3:rgba(28,20,38,.50);
  --accent:#7a2c63; --accent-2:#b46aa0; --accent-soft:rgba(122,44,99,.10); --accent-ink:#5c1f4a; --on-accent:#ffffff;
  --gold:#9a7424; --gold-soft:rgba(176,136,48,.16);
  --good:#1a8758; --good-soft:rgba(26,135,88,.13); --warn:#a96d12; --warn-soft:rgba(210,150,40,.17); --crit:#c03550; --crit-soft:rgba(192,53,80,.12);
  --hero-txt:#2a1430;
  --aura-1:#ffb2d8; --aura-2:#c2b1ff; --aura-3:#a3e4f2; --aura-4:#ffd6a6; --aura-5:#b2f0cf; --aura-o:.95;
  --shadow:0 1px 1px rgba(80,40,100,.04),0 14px 34px -18px rgba(90,40,120,.35);
  --r:24px; --r-sm:14px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-d:"Forum","Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0911; --tint:rgba(14,10,20,.88); --surface:rgba(255,255,255,.075); --surface-2:rgba(255,255,255,.06); --field:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18); --glass-brd:rgba(255,255,255,.16); --spec:rgba(255,255,255,.22);
  --sheen:linear-gradient(140deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.03) 34%,rgba(255,255,255,0) 60%);
  --iris:conic-gradient(from 210deg,#ff9fcf,#a99bff,#7fd3ff,#86f0c4,#ffd98a,#ff9fcf);
  --pearl:linear-gradient(118deg,#3a1d47 0%,#24305a 30%,#163f47 55%,#47283a 80%,#3a1d47 100%);
  --ink-grad:linear-gradient(118deg,#ffd9ec 0%,#e3d8ff 40%,#cdf3ee 75%,#ffeedd 100%);
  --num-grad:linear-gradient(100deg,#ffc0e0 0%,#c8bcff 50%,#9fe8e4 100%);
  --txt:#f6f0f9; --txt-2:rgba(246,240,249,.72); --txt-3:rgba(246,240,249,.48);
  --accent:#f0a6cf; --accent-2:#f5c3df; --accent-soft:rgba(240,166,207,.15); --accent-ink:#ffd2e8; --on-accent:#24101e;
  --gold:#e2bf72; --gold-soft:rgba(226,191,114,.16);
  --good:#62d39c; --good-soft:rgba(98,211,156,.15); --warn:#ebc062; --warn-soft:rgba(235,192,98,.16); --crit:#f38ea2; --crit-soft:rgba(243,142,162,.16);
  --hero-txt:#fff6fb;
  --aura-1:#9a3a86; --aura-2:#4b3fc0; --aura-3:#1a7486; --aura-4:#8a4a2e; --aura-5:#22735a; --aura-o:.72;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 16px 36px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0911; --tint:rgba(14,10,20,.88); --surface:rgba(255,255,255,.075); --surface-2:rgba(255,255,255,.06); --field:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18); --glass-brd:rgba(255,255,255,.16); --spec:rgba(255,255,255,.22);
  --sheen:linear-gradient(140deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.03) 34%,rgba(255,255,255,0) 60%);
  --iris:conic-gradient(from 210deg,#ff9fcf,#a99bff,#7fd3ff,#86f0c4,#ffd98a,#ff9fcf);
  --pearl:linear-gradient(118deg,#3a1d47 0%,#24305a 30%,#163f47 55%,#47283a 80%,#3a1d47 100%);
  --ink-grad:linear-gradient(118deg,#ffd9ec 0%,#e3d8ff 40%,#cdf3ee 75%,#ffeedd 100%);
  --num-grad:linear-gradient(100deg,#ffc0e0 0%,#c8bcff 50%,#9fe8e4 100%);
  --txt:#f6f0f9; --txt-2:rgba(246,240,249,.72); --txt-3:rgba(246,240,249,.48);
  --accent:#f0a6cf; --accent-2:#f5c3df; --accent-soft:rgba(240,166,207,.15); --accent-ink:#ffd2e8; --on-accent:#24101e;
  --gold:#e2bf72; --gold-soft:rgba(226,191,114,.16);
  --good:#62d39c; --good-soft:rgba(98,211,156,.15); --warn:#ebc062; --warn-soft:rgba(235,192,98,.16); --crit:#f38ea2; --crit-soft:rgba(243,142,162,.16);
  --hero-txt:#fff6fb;
  --aura-1:#7a2f6a; --aura-2:#3e3596; --aura-3:#155a6a; --aura-4:#6a3a26; --aura-5:#1d5a45; --aura-o:.62;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 16px 36px -16px rgba(0,0,0,.7);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-top:10px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,var(--hero-b),var(--hero-a));flex:none}
.mark svg{width:22px;height:22px;stroke:var(--hero-txt);fill:none;stroke-width:1.8}
.brand b{display:block;font-size:15px;font-weight:700;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:13px;display:grid;place-items:center;cursor:pointer;color:var(--txt);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* общие блоки */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.h h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin:0}
.h a,.h button.link{font-size:13px;color:var(--accent);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.muted{color:var(--txt-3)}
.small{font-size:13px}
.empty{font-size:14px;color:var(--txt-2);padding:6px 0}
.btn{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--txt);font-size:14px;font-weight:600;padding:10px 14px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{font-size:13px;padding:7px 11px;border-radius:11px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit);background:var(--crit-soft)}
.btn.block{width:100%}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--txt-2);white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)} .p-acc{background:var(--accent-soft);color:var(--accent-ink)} .p-gold{background:var(--gold-soft);color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--txt);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:14px;max-width:min(92vw,520px);box-shadow:var(--shadow);text-align:center}

/* герой */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;color:var(--hero-txt);background:radial-gradient(120% 140% at 100% 0%,var(--hero-b),var(--hero-a) 70%)}
.hero svg.rings{position:absolute;right:-18px;top:-10px;width:170px;height:170px;opacity:.22;stroke:var(--hero-txt);fill:none;stroke-width:1.2}
.hero .names{font-family:var(--f-d);font-size:28px;line-height:1.1;letter-spacing:.01em;position:relative;text-wrap:balance}
.hero .when{font-size:14px;opacity:.85;margin-top:4px;position:relative}
.count{display:flex;align-items:flex-end;gap:10px;margin-top:16px;position:relative}
.count .big{font-family:var(--f-d);font-size:64px;line-height:.85;font-variant-numeric:tabular-nums}
.count .lbl{font-size:14px;opacity:.85;padding-bottom:4px;line-height:1.25}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:var(--hero-txt)}

/* деньги */
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mk{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.mk .k{font-size:12px;color:var(--txt-3)}
.mk .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk.hl .v{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.bar .paid{background:var(--good)} .bar .left{background:var(--accent-2);opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--txt-3);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}

/* списки */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .t{font-size:15px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--txt-3);line-height:1.3}
.li .r{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;white-space:nowrap}
.li .r small{display:block;font-size:12px;font-weight:500;color:var(--txt-3)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.acc{background:var(--accent)}
.check{appearance:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.check svg{width:16px;height:16px;stroke:var(--on-accent);fill:none;stroke-width:3;opacity:0}
.check.on{background:var(--good);border-color:var(--good)} .check.on svg{opacity:1;stroke:#fff}
.mono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);flex:none;letter-spacing:.02em}
.mono.ok{background:var(--good-soft);color:var(--good)} .mono.gold{background:var(--gold-soft);color:var(--gold)}

/* команда */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tm{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:10px;cursor:pointer;min-width:0;text-align:left}
.tm:hover{border-color:var(--line-2)}
.tm b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm small{display:block;font-size:12px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* сегменты и чипы */
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;border:0;background:transparent;font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;color:var(--txt-2);cursor:pointer;white-space:nowrap;flex:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;cursor:pointer;border:1px dashed var(--line-2);background:transparent;font-size:13px;padding:6px 11px;border-radius:999px;color:var(--txt-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* категория */
.cat{padding:0;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cat-h .t{font-weight:700;font-size:16px}
.cat-h .grow{flex:1;min-width:0}
.cat-body{padding:4px 16px 12px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.vrow:first-child{border-top:0}
.vrow .t{font-weight:600}
.vrow .s{font-size:13px;color:var(--txt-3)}
.vrow .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.vrow .r small{display:block;font-size:12px;color:var(--txt-3);font-weight:500}
.mini{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;grid-column:1 / -1}
.mini i{display:block;height:100%;background:var(--good)}

/* лист (карточка подрядчика, настройки) */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:760px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px 12px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet-top .ttl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3)}
input.title{width:100%;border:0;background:transparent;font-family:var(--f-d);font-size:30px;line-height:1.15;color:var(--txt);padding:2px 0;outline:none}
input.title::placeholder{color:var(--txt-3)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--txt-3)}
.fld input,.fld select,.fld textarea{width:100%;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);color:var(--txt);padding:10px 12px;font:inherit;font-size:16px;outline:none}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.withbtn{display:flex;gap:6px}
.withbtn input{flex:1;min-width:0}
.withbtn .iconbtn{height:44px;width:44px}
.pay{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pay:first-child{border-top:0}
.pay .pin{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.1fr);gap:6px}
.pay input{min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--txt);padding:0 10px;font:inherit;font-size:15px;outline:none}
.pay input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pay .acts{display:flex;gap:4px}
.pay .acts .iconbtn{width:36px;height:36px;border-radius:10px}
.pay .meta{grid-column:2 / 4;font-size:12px;color:var(--txt-3);margin-top:-2px}
.agree{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.agree input[type=text]{min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--txt);padding:0 10px;font:inherit;font-size:15px;outline:none}
.agree input[type=text]:focus{border-color:var(--accent)}
.agree .gold.on{background:var(--gold);border-color:var(--gold)}
.statuses{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.statuses::-webkit-scrollbar{display:none}
.st{appearance:none;cursor:pointer;flex:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--txt-2)}
.st[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.st.no[aria-pressed="true"]{background:var(--txt-3);border-color:var(--txt-3)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .18s}
.sw.on{background:var(--good)} .sw.on::after{left:23px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .t{font-size:15px;line-height:1.3}
.task.done .t{color:var(--txt-3);text-decoration:line-through}
.task .d{font-size:12px;color:var(--txt-3);white-space:nowrap}
.task .x{appearance:none;border:0;background:none;color:var(--txt-3);cursor:pointer;font-size:18px;padding:0 4px}

/* вкладки */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--txt-3)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}

const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};

const money=n=>Math.round(+n||0).toLocaleString('ru-RU')+' '+CUR[st.cfg.currency||'BYN'];
/* валюты: курсы храним как «сколько BYN за 1 единицу» */
const DEF_RATES={USD:2.9458,EUR:3.2771,RUB:0.036622}; /* НБРБ на 29.10.2026, до первого обновления */
const base=()=>st.cfg.currency||'BYN';
const RT=(()=>{try{return JSON.parse(localStorage.getItem('wedding-rates')||'{}')||{};}catch(e){return {};}})(); /* курс на сегодня — свой на каждом устройстве, не синхронизируется */

const conv=(a,f,t)=>f===t?(+a||0):(+a||0)*rateOf(f)/rateOf(t);
const vc=v=>v.cur||base();
const pc=(p,v)=>p.cur||vc(v);

/* курс фиксируется в момент ввода суммы: fx — сколько BYN за 1 единицу, fxCur — для какой валюты, fxAt — когда */
const vfx=v=>v.fxCur===vc(v)?v.fx:undefined;

const rB=(c,fx)=>c==='BYN'?1:(+fx||rateOf(c));

async function fetchRates(){
  try{const r=await fetch('https://api.nbrb.by/exrates/rates?periodicity=0',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();const o={};let d='';

  return false;}
function setRates(o,src,date){const r={};Object.keys(o).forEach(k=>r[k]=+(+o[k]).toFixed(k==='RUB'?6:4));RT.rates=r;RT.ratesSrc=src;RT.ratesDate=date||ymd(today());RT.ratesAt=Date.now();RT.ratesMode='auto';saveRT();}

/* ---------- Фото: хранятся на устройстве (Telegram DeviceStorage или IndexedDB) ---------- */
const THUMB={};
const IMG=(()=>{const mem={};let idbP=null;
  const ds=()=>{try{return TGA&&TGA.DeviceStorage&&TGA.isVersionAtLeast&&TGA.isVersionAtLeast('9.0')?TGA.DeviceStorage:null;}catch(e){return null;}};
  const idb=()=>{if(!idbP)idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('wedding-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return idbP;};
  const op=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('i',mode);const rq=fn(tx.objectStore('i'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=tx.onabort=()=>rej(tx.error);}));
  const dsSet=(d,k,v)=>new Promise((res,rej)=>{try{d.setItem(k,v,(e,ok)=>e||ok===false?rej(e||'fail'):res());}catch(e){rej(e);}});
  const dsGet=(d,k)=>new Promise(res=>{try{d.getItem(k,(e,v)=>res(e?null:v||null));}catch(e){res(null);}});
  return {
    volatile:false,
    cache(k,v){mem[k]=v;},
    async put(k,v){const d=ds();if(d){try{await dsSet(d,k,v);mem[k]=v;return;}catch(e){}}try{await op('readwrite',s=>s.put(v,k));mem[k]=v;}catch(e){if(e&&e.name==='QuotaExceededError')throw e;mem[k]=v;this.volatile=true;}},
    async get(k){if(mem[k])return mem[k];const d=ds();if(d){const v=await dsGet(d,k);if(v)return mem[k]=v;}try{const v=await op('readonly',s=>s.get(k));if(v)return mem[k]=v;}catch(e){}return null;},
    async del(k){delete mem[k];const d=ds();if(d){try{await new Promise(res=>d.removeItem(k,()=>res()));}catch(e){}}try{await op('readwrite',s=>s.delete(k));}catch(e){}}
  };})();
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const out=(max,q)=>{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return {data:c.toDataURL('image/jpeg',q),w,h};};
    const r={full:out(1280,.78),thumb:out(360,.72)};URL.revokeObjectURL(url);res(r);};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};im.src=url;});}
async function addImages(files){const v=st.vendors[sheetVendor];if(!v)return;const arr=[...files].filter(f=>/^image\//.test(f.type)||/\.(heic|jpe?g|png|webp)$/i.test(f.name)).slice(0,12);if(!arr.length)return;
  toast(arr.length>1?'Сохраняю фото…':'Сохраняю…');let ok=0;
  for(const f of arr){try{const r=await shrink(f);const id=uid();await IMG.put('i_'+id,r.full.data);await IMG.put('t_'+id,r.thumb.data);THUMB[id]=r.thumb.data;v.imgs.push({id,w:r.full.w,h:r.full.h,at:Date.now(),up:false});ok++;if(SY.ready)uploadImg(v.id,id,r.full.data,r.thumb.data);}
    catch(e){toast(ok?'Сохранено '+ok+' фото, на остальные не хватило места.':'Не получилось сохранить фото на этом устройстве.');break;}}
  if(ok){persist('v',v.id);renderImgs();haptic('ok');if(IMG.volatile)toast('Этот браузер не даёт хранить фото — они пропадут после закрытия.');else if(ok===arr.length)toast(ok===1?'Фото добавлено.':'Добавлено фото: '+ok+'.');}}
async function delImage(vid,id){const v=st.vendors[vid];if(!v)return;v.imgs=v.imgs.filter(x=>x.id!==id);delete THUMB[id];persist('v',vid);dropRemoteImg(id);await IMG.del('i_'+id);await IMG.del('t_'+id);}
async function hydrate(root){const els=(root||document).querySelectorAll('img[data-iid]');for(const im of els){if(im.getAttribute('src'))continue;const id=im.dataset.iid;let d=THUMB[id];if(!d){d=await IMG.get('t_'+id);if(!d&&SY.ready){d=await remoteImg(id,'thumb');if(d)IMG.put('t_'+id,d).catch(()=>{});}if(d)THUMB[id]=d;}if(d)im.src=d;}}

function openLb(vid,iid){const v=st.vendors[vid];if(!v)return;const i=v.imgs.findIndex(x=>x.id===iid);if(i<0)return;closeLb();lb={vid,i};const el=document.createElement('div');el.className='lb';el.id='lb';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Фото');document.body.appendChild(el);
  let sx=null;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});el.addEventListener('touchend',e=>{if(sx==null||!lb)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)stepLb(dx<0?1:-1);});drawLb();}

  let full=await IMG.get('i_'+im.id);if(!full&&SY.ready){full=await remoteImg(im.id,'full');if(full)IMG.cache('i_'+im.id,full);}const img=el.querySelector('.lb-img img');if(img&&full&&lb&&v.imgs[lb.i]===im)img.src=full;}

  st.tasks.forEach(t=>{if(t.done)return;const due=taskDue(t);const d=daysTo(due);if(d!=null&&d<=14)items.push({kind:'task',d,t});});

let drag=null;
document.addEventListener('pointerdown',e=>{const hd=e.target.closest('[data-drag]');if(!hd)return;const row=hd.closest('.task');if(!row)return;e.preventDefault();
  const r=row.getBoundingClientRect();drag={row,list:row.parentElement,grab:e.clientY-r.top,y:e.clientY,raf:0};row.classList.add('dragging');document.body.classList.add('dragmode');
  try{hd.setPointerCapture(e.pointerId);}catch(_){}haptic();dragLoop();});
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();drag.y=e.clientY;dragUpdate();},{passive:false});
function dragUpdate(){if(!drag)return;const {row,list,y,grab}=drag;row.style.transform='';let r=row.getBoundingClientRect(),moved=false,guard=0;
  while(guard++<60){const prev=row.previousElementSibling,next=row.nextElementSibling;
    if(prev){const pr=prev.getBoundingClientRect();if(y-grab<pr.top+pr.height/2){list.insertBefore(row,prev);moved=true;r=row.getBoundingClientRect();continue;}}
    if(next){const nr=next.getBoundingClientRect();if(y-grab+r.height>nr.top+nr.height/2){list.insertBefore(next,row);moved=true;r=row.getBoundingClientRect();continue;}}
    break;}
  if(moved)haptic('sel');row.style.transform='translateY('+(y-grab-r.top)+'px)';}
function dragLoop(){if(!drag)return;const y=drag.y,H=window.innerHeight;let dy=0;if(y<90)dy=-Math.ceil((90-y)/5);else if(y>H-150)dy=Math.ceil((y-(H-150))/5);if(dy){window.scrollBy(0,dy);dragUpdate();}drag.raf=requestAnimationFrame(dragLoop);}
function endDrag(){if(!drag)return;cancelAnimationFrame(drag.raf);const {row,list}=drag;drag=null;row.classList.remove('dragging');row.style.transform='';document.body.classList.remove('dragmode');
  const ids=[...list.querySelectorAll('.task')].map(x=>x.dataset.tid);const map=Object.fromEntries(st.tasks.map(t=>[t.id,t]));const re=ids.map(i=>map[i]).filter(Boolean);
  if(re.length===st.tasks.length&&re.some((t,i)=>t!==st.tasks[i])){st.tasks=re;persist('tasks');}}

  if((el=t.closest('[data-contract]'))){v.contract=!v.contract;if(v.contract&&!v.contractDate)v.contractDate=ymd(today());if(v.contract&&(v.status==='search'||v.status==='talks'||v.status==='agreed'))v.status='contract';persist('v',v.id);haptic('ok');openVendor(v.id);return;}
  if((el=t.closest('[data-vdel]'))){const filled=vendorFilled(v);confirmBox({title:'Удалить «'+(v.name||catName(v.cat))+'»?',text:filled?'В карточке уже есть данные: цена, платежи, договорённости или контакты. Они удалятся'+(SY.ready?' у всех участников':'')+'.':'Карточка пустая, удалим её.',protect:filled,onOk:()=>{removeVendor(v);closeSheet();toast('Удалено.');}});return;}
  if((el=t.closest('[data-cact]'))){const k=el.dataset.cact;
    if(k==='call'&&v.phone){const a=document.createElement('a');a.href='tel:'+v.phone.replace(/[^\d+]/g,'');a.click();}
    else if(k==='copyphone'&&v.phone)copy(v.phone);
    else if(k==='tg'&&v.tg){const u=v.tg.replace(/^https?:\/\/t\.me\//,'').replace(/^@/,'');openUrl('https://t.me/'+u);}
    else if(k==='ig'&&v.ig){const u=v.ig.replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/^@/,'').replace(/\/$/,'');openUrl('https://instagram.com/'+u);}
    else if(k==='link'&&v.link)openUrl(/^https?:/.test(v.link)?v.link:'https://'+v.link);
    else if(k==='clink'&&v.contractLink)openUrl(/^https?:/.test(v.contractLink)?v.contractLink:'https://'+v.contractLink);
    else if(k==='copyemail'&&v.email)copy(v.email);
    else toast('Сначала заполните поле.');
    return;}
});
function addAgree(text){const v=st.vendors[sheetVendor];text=(text||'').trim();if(!text)return;v.agree.push({id:uid(),t:text,inContract:false});persist('v',v.id);const n=$('#newAgree');if(n)n.value='';renderAgree();}
function togglePay(vid,pid){const v=st.vendors[vid];const p=v&&v.pays.find(x=>x.id===pid);if(!p)return;p.paid=!p.paid;p.paidAt=p.paid?ymd(today()):'';
  const s=vStats(v);if(p.paid&&s.price&&s.paid>=s.price&&v.status!=='no')v.status='done';
  haptic(p.paid?'ok':'');persist('v',vid);if(p.paid)toast('Отмечено: внесено '+moneyC(p.amount,pc(p,v))+'.');}
function updateRatesNow(){toast('Обновляю курс…');fetchRates().then(ok=>{refreshRatesUI();render();toast(ok?ratesNote()+'.':'Не удалось получить курс. Введите его вручную.');});}
document.addEventListener('input',e=>{
  const t=e.target;const v=st.vendors[sheetVendor];
  if(SY.ro&&!t.classList.contains('keep')&&!t.dataset.rate)return;
  if(t.dataset.te){const row=t.closest('[data-tid]');const tk=row&&st.tasks.find(x=>x.id===row.dataset.tid);if(!tk)return;if(t.dataset.te==='t')tk.t=t.value;else{if(t.value)tk.due=t.value;else delete tk.due;}persist('tasks');return;}
  if(t.dataset.gf&&sheetGuest){const g=st.guests[sheetGuest];if(g){g[t.dataset.gf]=t.value;persist('g',g.id);}return;}
  if(t.dataset.tf){const tk=st.tasks.find(x=>x.id===sheetTask);if(!tk)return;if(t.dataset.tf==='t')tk.t=t.value;else{if(t.value)tk.due=t.value;else delete tk.due;}persist('tasks');return;}
  if(t.dataset.rate){const k=t.dataset.rate;let val=+String(t.value).replace(',','.');if(!(val>0))return;if(k==='RUB')val/=100;RT.rates={USD:rateOf('USD'),EUR:rateOf('EUR'),RUB:rateOf('RUB')};RT.rates[k]=val;RT.ratesMode='manual';RT.ratesSrc='';saveRT();const sw=document.querySelector('[data-ratesauto]');if(sw){sw.classList.remove('on');sw.setAttribute('aria-pressed','false');}const n=$('#ratesNote');if(n)n.textContent=ratesNote();return;}
  if(t.dataset.secname){const c=customCats().find(x=>x.k===t.dataset.secname);if(c){c.name=t.value;c.mono=monoOf(t.value);st.cfg.cats=customCats().slice();persist('cfg');const m=document.querySelector('[data-secmono="'+c.k+'"]');if(m)m.textContent=c.mono;}return;}
  if(t.dataset.cf){const k=t.dataset.cf;st.cfg[k]=(k==='budget'||k==='guests'||k==='menuA'||k==='menuK')?(+String(t.value).replace(',','.')||0):t.value;persist('cfg');if(k==='menuA'||k==='menuK'){const b=$('#banq');if(b)b.innerHTML=banqHTML();return;}$('#brandSub').textContent=[st.cfg.n1,st.cfg.n2].filter(Boolean).join(' & ')||'План, подрядчики и платежи';return;}
  if(!v)return;
  if(t.dataset.vf){const k=t.dataset.vf;v[k]=k==='price'?(+String(t.value).replace(',','.')||0):t.value;if(k==='price'&&v.price>0&&!vfx(v)){fixRate(v,vc(v));renderVfx();}persist('v',v.id);if(k==='price')updMoney();return;}
  if(t.dataset.vfx!==undefined){const val=fxParse(vc(v),t.value);if(!val)return;v.fx=val;v.fxCur=vc(v);v.fxAt=ymd(today());persist('v',v.id);updMoney();return;}
  if(t.dataset.pfx){const p=v.pays.find(x=>x.id===t.dataset.pfx);if(!p)return;const val=fxParse(pc(p,v),t.value);if(!val)return;p.fx=val;p.fxCur=pc(p,v);p.fxAt=ymd(today());persist('v',v.id);updMoney();return;}
  if(t.dataset.pf){const pid=t.closest('[data-pid]').dataset.pid;const p=v.pays.find(x=>x.id===pid);if(!p)return;p[t.dataset.pf]=t.dataset.pf==='amount'?(+String(t.value).replace(',','.')||0):t.value;if(t.dataset.pf==='amount'&&p.amount>0&&!pfx(p,v)){fixRate(p,pc(p,v));const fi=t.closest('.pay').querySelector('[data-pfx]');if(fi)fi.value=fxShow(pc(p,v),p.fx);}persist('v',v.id);updMoney();if(t.dataset.pf==='due'){const m=t.closest('.pay').querySelector('.meta');if(m)m.textContent=p.paid?'внесено':p.due?relDays(daysTo(p.due)):'укажите срок, чтобы получить напоминание';}return;}
  if(t.dataset.af){const aid=t.closest('[data-aid]').dataset.aid;const a=v.agree.find(x=>x.id===aid);if(a){a.t=t.value;persist('v',v.id);}return;}
});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.cf==='currency'){render();return;}
  if(t.dataset.te==='due'&&st.cfg.todoMode!=='manual'){/* дату поменяли — задача может переехать в другой период */setTimeout(()=>{const a=document.activeElement;if(!a||!a.dataset||!a.dataset.te)render();},300);return;}
  if(t.dataset.imgin!==undefined&&t.files){const f=[...t.files];t.value='';addImages(f);return;}
  const v=st.vendors[sheetVendor];if(!v)return;
  if(t.dataset.vcur!==undefined){v.cur=t.value;fixRate(v,v.cur,true);v.pays.forEach(p=>{if(p.cur===v.cur)delete p.cur;if(!p.cur)fixRate(p,v.cur,true);});persist('v',v.id);renderVfx();renderPays();updMoney();return;}
  if(t.dataset.pcur){const p=v.pays.find(x=>x.id===t.dataset.pcur);if(!p)return;if(t.value===vc(v))delete p.cur;else p.cur=t.value;fixRate(p,pc(p,v),true);persist('v',v.id);renderPays();updMoney();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newAgree'){e.preventDefault();addAgree(e.target.value);}if(e.key==='Escape'){if(!closeLb())closeSheet();}if(lb&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))stepLb(e.key==='ArrowRight'?1:-1);});
document.addEventListener('submit',e=>{if(e.target.id==='secForm'){e.preventDefault();const k=addSection($('#secNew').value);if(k){openSections();toast('Раздел добавлен — он появился в «Подрядчиках».');}return;}
  if(e.target.id==='secFormV'){e.preventDefault();const k=addSection($('#secNewV').value);if(k)newVendor(k);return;}
  if(SY.ro){e.preventDefault();return;}
  if(e.target.id==='addGuest'){e.preventDefault();const inp=$('#newGuest');const added=addGuests([inp.value]);if(added.length){render();haptic('ok');const n=$('#newGuest');if(n)n.focus();}return;}
  if(e.target.id==='addTask'){e.preventDefault();const t=$('#newTask').value.trim();if(!t)return;st.tasks.push({id:uid(),t,off:null,due:$('#newTaskDate').value||'',done:false,custom:true});persist('tasks');render();}});

/* ---------- Старт ---------- */
function crashScreen(err){try{console.error(err);}catch(e){}
  if(document.getElementById('crash'))return;const el=document.createElement('div');el.id='crash';el.className='modal';
  el.innerHTML='<div class="modal-in"><h3>Что-то пошло не так</h3><p>Данные на сервере в порядке. Попробуйте перезагрузить. Если не поможет — сбросьте копию на этом телефоне: всё подтянется заново'+(SY.on?' с сервера':'')+'.</p><p class="small muted" style="word-break:break-word">Код ошибки: '+esc(String(err&&(err.message||err)||'?').slice(0,180))+'</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="crashReset">Сбросить на телефоне</button><button type="button" class="btn primary" id="crashReload">Перезагрузить</button></div></div>';
  document.body.appendChild(el);
  el.querySelector('#crashReload').onclick=()=>location.reload();
  el.querySelector('#crashReset').onclick=()=>{if(!SY.on&&!confirm('Данные хранятся только на этом устройстве и удалятся. Продолжить?'))return;try{['wedding-v1','wedding-pending','wedding-meta'].forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();};}
const _render=render;render=function(){try{_render();}catch(e){crashScreen(e);}};
window.addEventListener('error',e=>{if(e&&e.message&&/Script error/.test(e.message))return;if(!view.innerHTML.trim())crashScreen(e.error||e.message);else try{console.error(e.error||e.message);}catch(_){}});
try{loadLocal();ensureTasks();}catch(e){try{localStorage.removeItem('wedding-v1');}catch(_){}st=normalize({});ensureTasks();}
render();initStore().then(autoRates,autoRates).catch(crashScreen);
})();
</script>
